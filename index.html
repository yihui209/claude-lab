<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奕慧｜自我介紹</title>
  <meta name="description" content="我叫奕慧，馬來西亞人，目前在台灣的儀器代理商擔任業務。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #14213d;
      --muted: #5b6680;
      --card: #ffffff;
      --bg-1: #0b1736;
      --bg-2: #1b2f6b;
      --bg-3: #3a2b74;
      --gold: #d4af5a;
      --gold-light: #f0d999;
      --gold-text: #8a6514; /* 白底上的金色文字，維持足夠對比 */
      --accent-grad: linear-gradient(135deg, #f3d98f 0%, #d4a84a 55%, #b9863a 100%);
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.14);
      --on-dark: #ffffff;
      --on-dark-soft: rgba(255, 255, 255, 0.8);
      --radius-lg: 24px;
      --radius-md: 18px;
      --serif: "Noto Serif TC", "PMingLiU", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg-1);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* 固定漸層背景＋柔和光暈 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(40% 35% at 88% 6%, rgba(240, 200, 120, 0.22), transparent 70%),
        radial-gradient(45% 40% at 5% 95%, rgba(80, 160, 230, 0.25), transparent 70%),
        radial-gradient(50% 45% at 60% 55%, rgba(140, 90, 220, 0.18), transparent 75%),
        linear-gradient(145deg, var(--bg-2) 0%, var(--bg-1) 48%, var(--bg-3) 100%);
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: clamp(32px, 8vw, 88px) clamp(16px, 5vw, 40px) clamp(48px, 8vw, 88px);
    }

    /* 開場區：玻璃質感圓角面板 */
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: clamp(24px, 5vw, 56px);
      padding: clamp(28px, 5vw, 52px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.03));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(3, 8, 24, 0.45);
      color: var(--on-dark);
    }

    .eyebrow {
      display: inline-block;
      padding: 4px 14px;
      border: 1px solid rgba(240, 217, 153, 0.45);
      border-radius: 999px;
      background: rgba(240, 217, 153, 0.1);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      color: var(--gold-light);
    }

    h1 {
      margin: 18px 0 16px;
      font-family: var(--serif);
      font-size: clamp(2.3rem, 7vw, 4rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, #ffffff 0%, #ffffff 55%, var(--gold-light) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      max-width: 28em;
      font-size: clamp(1.05rem, 2.3vw, 1.22rem);
      line-height: 1.85;
      color: var(--on-dark-soft);
    }

    .lead::before {
      content: "";
      display: block;
      width: 56px;
      height: 4px;
      margin-bottom: 18px;
      border-radius: 999px;
      background: var(--accent-grad);
    }

    /* 字標：漸層外圈 */
    .monogram {
      display: grid;
      place-items: center;
      width: clamp(120px, 20vw, 184px);
      aspect-ratio: 1;
      border-radius: 50%;
      padding: 4px;
      background: var(--accent-grad);
      box-shadow: 0 16px 40px rgba(212, 175, 90, 0.28);
      color: var(--gold-light);
      font-family: var(--serif);
      font-size: clamp(3rem, 8.5vw, 5rem);
      font-weight: 600;
      line-height: 1;
      position: relative;
      isolation: isolate;
    }

    .monogram::before {
      content: "";
      position: absolute;
      inset: 4px;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #24407e, var(--bg-1) 75%);
    }

    /* 基本資料：獨立圓角小卡 */
    .facts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: clamp(20px, 3vw, 28px);
    }

    .fact {
      padding: 20px 22px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .fact:hover {
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(240, 217, 153, 0.4);
    }

    .fact dt {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--gold-light);
    }

    .fact dd {
      margin-top: 4px;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--on-dark);
    }

    /* 工作內容 */
    .work { margin-top: clamp(48px, 8vw, 80px); }

    h2 {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 26px;
      font-family: var(--serif);
      font-size: clamp(1.4rem, 3.3vw, 1.85rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--on-dark);
    }

    h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(240, 217, 153, 0.7), transparent);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      list-style: none;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 30px 26px 32px;
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: 0 14px 36px rgba(3, 8, 24, 0.35);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 卡片頂部漸層色條 */
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: var(--accent-grad);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 26px 50px rgba(3, 8, 24, 0.5);
    }

    .num {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fbf3dc, #f3e2b3);
      color: var(--gold-text);
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    h3 {
      margin: 18px 0 8px;
      font-size: 1.22rem;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .card p {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--muted);
    }

    /* 進場動畫 */
    .rise { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .facts.rise { animation-delay: 0.12s; }
    .work.rise { animation-delay: 0.24s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none; }
      .card, .fact { transition: none; }
      .card:hover { transform: none; }
    }

    @media (max-width: 860px) {
      .cards { grid-template-columns: 1fr; }
      .facts { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 520px) {
      .hero { grid-template-columns: 1fr; }
      .monogram { order: -1; width: 100px; font-size: 2.8rem; }
      .fact { padding: 16px 18px; }
      .fact dd { font-size: 1.08rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero rise">
      <div>
        <p class="eyebrow">自我介紹</p>
        <h1>你好，我是奕慧</h1>
        <p class="lead">我是馬來西亞人，目前在台灣的儀器代理商擔任業務。</p>
      </div>
      <div class="monogram" aria-hidden="true">慧</div>
    </header>

    <dl class="facts rise">
      <div class="fact"><dt>家鄉</dt><dd>馬來西亞</dd></div>
      <div class="fact"><dt>工作地點</dt><dd>台灣</dd></div>
      <div class="fact"><dt>公司類型</dt><dd>儀器代理商</dd></div>
      <div class="fact"><dt>職務</dt><dd>業務</dd></div>
    </dl>

    <section class="work rise">
      <h2>我目前負責的工作</h2>
      <ul class="cards">
        <li class="card">
          <span class="num">01</span>
          <h3>市場開發</h3>
          <p>負責開發新的市場。</p>
        </li>
        <li class="card">
          <span class="num">02</span>
          <h3>產品調查與談代理</h3>
          <p>調查產品，並洽談代理合作。</p>
        </li>
        <li class="card">
          <span class="num">03</span>
          <h3>B2B 市場買賣</h3>
          <p>負責企業對企業市場的買賣。</p>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
